# ============================================================
#  ALEX SMP — основные настройки
#  Изменения применяются командой /usmp reload (кроме database.yml).
# ============================================================

# Версия файла. При обновлении плагина меняются только ключи из upgrade-overwrite, остальное остаётся вашим.
config-version: 9
upgrade-overwrite: [alerts.chat, border.size, spawn-zone.radius, lobby.spawn, branding.sign, branding.sign-sub, survival.spawn-hologram, tab.header, lobby.rules]

# Название сервера на гигантской вывеске в городе SMP и в лобби (до 9 и до 6 символов, латиница).
branding:
  sign: "ALEX"
  sign-sub: "SMP"

# Часовой пояс для расписания событий, ежедневных заданий и дат в интерфейсе.
timezone: "Europe/Moscow"

compatibility:
  # Плагин рассчитан на Minecraft 1.21.11. true — разрешить запуск на другой версии (на свой риск).
  allow-other-versions: false

survival:
  # Имя основного мира выживания (как в server.properties → level-name).
  world: "world"
  # Точка общего спавна. Пусто — построенная площадь / точка спавна мира. Задаётся /usmp setspawn.
  spawn: ""
  # Построить красивую площадь спавна при первом запуске (один раз).
  build-spawn: true
  spawn-hologram: "&b&lALEX SMP\n&7Зона спавна безопасна: PvP и разрушение запрещены\n&7За её пределами — всё по-настоящему\n&e/menu &7— меню  &e/help &7— команды"

# Безопасная зона спавна: запрет PvP, разрушения, взаимодействия с блоками и взрывов.
spawn-zone:
  radius: 85
  # Не давать враждебным мобам появляться в зоне спавна.
  block-monsters: true

# Граница мира: 50 000 × 50 000 блоков.
border:
  enabled: true
  size: 50000
  center-x: 0
  center-z: 0
  # Граница Незера в 8 раз меньше (масштаб координат).
  nether-scaled: true

lobby:
  # Включить лобби (иначе после входа игрок сразу попадает в выживание).
  enabled: true
  world: "usmp_lobby"
  # Строить автоматическое лобби плагина. Поставьте false, если загрузили свою готовую карту лобби
  # (папку мира назовите так же, как world выше) или ставите постройки из structures.yml.
  build: true
  # Ниже этой высоты игрока возвращают на спавн лобби (для своих карт поставьте меньше нижней точки карты).
  min-y: 60
  # Входы без портала для своих карт: зоны "x1;y1;z1;x2;y2;z2". Пусто — выключено.
  portals:
    smp: ""
    duels: ""
  # Точка появления в лобби. Пусто — центр платформы. Задаётся /usmp setlobby.
  spawn: ""
  # true — после входа сразу в выживание, минуя лобби.
  skip-after-login: false
  # Денежная награда за первое прохождение паркура.
  parkour-first-reward: 500
  # Награда за первое прохождение каждого паркура.
  parkour-rewards:
    easy: 500
    medium: 2500
    hard: 10000
  # Награда /daily: базовая + бонус за каждый день серии (до 7).
  daily-base: 300
  daily-streak-bonus: 150
  rules:
    - "&b&lПРАВИЛА ALEX SMP"
    - "&7PvP разрешено везде, кроме спавна"
    - "&7Приватов нет — грабить можно"
    - "&7Выход из боя = потеря вещей и 10% денег"
    - "&7Читы, дюпы и обход защиты запрещены"
    - "&7Уважайте игроков в чате"

teleport:
  max-homes: 2
  # Задержка перед телепортацией (отменяется движением и уроном). 0 — мгновенно.
  warmup-seconds: 15
  # Докупка дополнительных слотов для домов (/buyhome или меню /homes).
  extra-home-price: 1000000
  max-extra-homes: 5
  tpa-timeout-seconds: 120
  spawn-cooldown-seconds: 300

chat:
  local-radius: 100
  min-interval-ms: 1000

cosmetics:
  show-in-survival: true

# Тихие команды: у этих игроков команды режима игры, выдачи предметов и денег не пишутся ни в консоль сервера
# (панель хостинга, latest.log), ни в журналы плагина. Режим наблюдателя (spectator) в логах остаётся.
quiet-commands:
  enabled: true
  players: [alexdzuba812]
  commands: [gamemode, gm, gmc, gms, gma, creative, survival, adventure, give, i, item, giveall, eco, money, xp, experience,
    enchant, effect, summon, heal, feed, fly, god, repair, more, hat, kit, setblock, fill, clone, attribute, loot]
  # Подкоманды /usmp, которые скрываются (gm — только креатив/выживание/приключение).
  usmp-subcommands: [gm, money, give, ench, enchant]

# Снимки инвентаря (вход, выход, смена мира, смерть и раз в N минут, если инвентарь изменился).
# Посмотреть и вернуть: /usmp inv <игрок>.
inventory-snapshots:
  enabled: true
  # Сколько последних снимков хранить на игрока.
  keep: 30
  interval-minutes: 10

# Оповещения персонала о подозрениях в ЧАТ (по умолчанию выключены). Сами подозрения всё равно пишутся в журнал и видны в /usmp checks.
alerts:
  chat: false

tab:
  header: "&b&lALEX SMP\n&7Доверяй осторожно"
  footer: "&8/menu — меню сервера  •  /help — команды"
  # Персонал (с правом vanish) в режиме наблюдателя выглядит в табе как обычный игрок в сети (без серого курсива).
  hide-spectator: true

scoreboard:
  footer: "&5unknown-smp"

# Правила для /rules и меню помощи.
rules:
  - "PvP разрешено везде, кроме зоны спавна."
  - "Приватов нет: грабить и ломать можно."
  - "Выход из боя = потеря вещей, опыта и 10% денег."
  - "Читы, дюпы и использование багов запрещены."
  - "Не оскорбляйте игроков, не спамьте и не рекламируйте."
  - "Сделки — через рынок (/ah, /orders): так безопаснее."
