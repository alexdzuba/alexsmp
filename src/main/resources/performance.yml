# ============================================================
#  Производительность и мониторинг
# ============================================================
# Как часто сохранять некритичные данные профилей (репутация, статистика, настройки). Деньги сохраняются сразу.
profile-save-seconds: 60

monitor:
  # Предупреждение администраторам, если среднее время тика выше (мс).
  mspt-warning: 45
  # Предупреждение, если очередь записи в БД больше.
  db-queue-warning: 500

rollback:
  # Сколько блоков восстанавливать за тик при откате.
  blocks-per-tick: 300
