# ============================================================
#  Offline-авторизация. Требует online-mode=false в server.properties.
# ============================================================
enabled: true

# Неверных попыток подряд до временной блокировки (по аккаунту и по IP).
max-attempts: 10
# Длительность временной блокировки входа.
lockout-minutes: 15
# Время на вход после подключения.
login-timeout-seconds: 60

sessions:
  # Доверенная сессия: повторный вход без пароля с того же IP.
  enabled: true
  days: 7

# Итерации PBKDF2-HMAC-SHA256 (рекомендация OWASP — 600 000). Старые хеши пересчитываются при входе.
pbkdf2-iterations: 600000

password:
  min-length: 6
  max-length: 64

# Максимум регистраций с одного IP (защита от мультиаккаунтов ради стартового баланса). 0 — без ограничения.
max-accounts-per-ip: 3
