start-balance: 10000

death:
  # Потеря баланса при смерти от игрока (округление вниз). Деньги получает убийца.
  loss-percent: 10

combat-logout:
  # Потеря баланса при выходе во время боя. Получает игрок, нанёсший больше всего урона в текущем бою.
  # При равенстве урона — тот, кто ударил последним. Если источника урона нет — деньги сгорают.
  loss-percent: 10

pay:
  min: 1
  max: 1000000000
  # Подтверждение через GUI для крупных переводов.
  confirm-above: 100000
