# ============================================================
#  Рынок ALEX SMP 2.0
#  Цены задаются только «сырью» (values). Цена любого скрафченного или переплавленного предмета
#  считается автоматически по рецептам игры: сумма ингредиентов, без надбавки.
#  Поэтому крафт и автокрафтеры НЕ создают прибыль — заработать «из воздуха» нельзя.
#  Магазин продаёт дороже стоимости, скупка платит дешевле — перепродажа всегда в убыток.
# ============================================================

# Версия файла. Если в новой версии плагина число больше, старый файл сохраняется как market.yml.old-v… и заменяется.
config-version: 6

pricing:
  # Цена в магазине = стоимость × buy-markup
  buy-markup: 1.8
  # Цена скупки = стоимость × sell-fraction
  sell-fraction: 0.45
  # Все цены из values и fixed-values умножаются на этот коэффициент (10 = цены в 10 раз выше).
  value-scale: 10
  # Минимальная цена скупки одной штуки сырья (до падения цены от объёма продаж).
  min-sell-price: 10
  # Надбавка скупки за каждый уровень зачарования (на предмете или в книге)
  enchant-bonus-per-level: 30

sell:
  # Сколько всего игрок может заработать скупкой за сутки (по часовому поясу из config.yml).
  daily-limit-per-player: 20000000
  # С одного вида предмета за сутки по полной цене; дальше этот вид скупается дешевле.
  item-soft-cap: 4000000
  # Доля цены после мягкого лимита (0.35 = 35%).
  over-cap-fraction: 0.35
  # Падение цены при большой продаже одного вида предмета за сутки: после half-items проданных штук цена вдвое ниже
  # (плавно, 1/(1+n/half)), но не ниже floor от начальной цены.
  volume-decay: {half-items: 256, floor: 0.2}
  # С какой цены скупки за 1 шт. цена падает быстрее (для дорогих вещей: алмазы, трезубец и т.п.).
  # Если не задано — 40 × value-scale (при value-scale: 10 это 400). Задать вручную: {half-items: 256, floor: 0.2, expensive-price: 400}
  # Цена уникальных предметов плагина по редкости (улучшенные зелья — 1/10). Сюжетные артефакты не скупаются.
  unique-rarity-prices: {common: 1000, uncommon: 10000, rare: 40000, epic: 120000, legendary: 350000}
  # Никогда не скупается.
  blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, COMMAND_BLOCK_MINECART,
    STRUCTURE_BLOCK, STRUCTURE_VOID, JIGSAW, LIGHT, DEBUG_STICK, KNOWLEDGE_BOOK, SPAWNER, TRIAL_SPAWNER, VAULT,
    DRAGON_EGG, END_PORTAL_FRAME, REINFORCED_DEEPSLATE, PETRIFIED_OAK_SLAB, TEST_BLOCK, TEST_INSTANCE_BLOCK]

shop:
  # Что НЕ продаётся в магазине: premium (алмазы, незерит, элитры и всё, что из них), а также всё из Незера и Энда —
  # это добывают сами. Удалите метку из списка, чтобы открыть такие товары в магазине.
  buyable-tags-blocked: [premium, nether, end]
  # Отдельные предметы, которых нет в магазине.
  blacklist: [TOTEM_OF_UNDYING, ENCHANTED_GOLDEN_APPLE, GOLDEN_APPLE, ENDER_PEARL, ENDER_EYE, EXPERIENCE_BOTTLE,
    TNT, TNT_MINECART, END_CRYSTAL, RESPAWN_ANCHOR, SPONGE, WET_SPONGE, HEART_OF_THE_SEA, CONDUIT, TRIDENT,
    NAUTILUS_SHELL, ECHO_SHARD, RECOVERY_COMPASS, SNIFFER_EGG, TRIAL_KEY, OMINOUS_TRIAL_KEY, HEAVY_CORE, MACE,
    BREEZE_ROD, WIND_CHARGE, ENCHANTED_BOOK, SADDLE, NAME_TAG, ELYTRA, BEACON, OBSIDIAN, CRYING_OBSIDIAN]

mail:
  capacity: 10

auction:
  max-lots-per-player: 10
  max-price: 1000000000000

orders:
  max-per-player: 10

# Метки распространяются на всё, что крафтится из этих предметов (по самому дешёвому рецепту).
tags:
  nether: [NETHERRACK, NETHER_QUARTZ_ORE, QUARTZ, GLOWSTONE_DUST, SOUL_SAND, SOUL_SOIL, NETHER_WART, BLAZE_ROD,
    GHAST_TEAR, MAGMA_CREAM, BLACKSTONE, BASALT, CRIMSON_STEM, WARPED_STEM, CRIMSON_FUNGUS, WARPED_FUNGUS,
    NETHER_WART_BLOCK, WARPED_WART_BLOCK, SHROOMLIGHT, WEEPING_VINES, TWISTING_VINES, ANCIENT_DEBRIS,
    NETHER_GOLD_ORE, GILDED_BLACKSTONE, WITHER_SKELETON_SKULL, NETHER_STAR, NETHERITE_UPGRADE_SMITHING_TEMPLATE,
    PIGLIN_HEAD, RIB_ARMOR_TRIM_SMITHING_TEMPLATE, SNOUT_ARMOR_TRIM_SMITHING_TEMPLATE, MUSIC_DISC_PIGSTEP]
  end: [END_STONE, CHORUS_FRUIT, CHORUS_FLOWER, SHULKER_SHELL, ELYTRA, DRAGON_HEAD, DRAGON_BREATH, PURPUR_BLOCK,
    SPIRE_ARMOR_TRIM_SMITHING_TEMPLATE]
  premium: [DIAMOND, DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, EMERALD, EMERALD_ORE, DEEPSLATE_EMERALD_ORE, ANCIENT_DEBRIS,
    NETHERITE_SCRAP, ELYTRA, TOTEM_OF_UNDYING, NETHER_STAR, HEART_OF_THE_SEA, ECHO_SHARD, HEAVY_CORE, BREEZE_ROD,
    TRIDENT, SHULKER_SHELL, ENCHANTED_GOLDEN_APPLE, DRAGON_HEAD]

