# ============================================================
#  Жора — ИИ-персонаж сервера (подколы, память, летопись, жалобы, аналитика читов)
#  Изменения применяются командой /zhora reload (или /usmp reload).
#  ВАЖНО: ключ API вставьте в api.key (или в переменную окружения ZHORA_API_KEY).
#  Не публикуйте этот файл — в нём секрет. Плагин не пишет ключ в логи и чат.
# ============================================================
config-version: 1
enabled: true

# --- ИИ-провайдер (формат OpenAI Chat Completions) ---
api:
  # Базовый адрес; запросы идут на <endpoint>/chat/completions
  endpoint: "https://2.27.20.129/slfe/v1"
  key: "n2a_eqLvVDi2qKaq234vqRJXuVDSFvvjOjJDUX9G721waoE"
  key-env: "ZHORA_API_KEY"
  model: "deepseek-v4.1-flash"
  temperature: 0.9
  # Модель с «рассуждениями» тратит часть токенов на размышления — не ставьте слишком мало.
  max-tokens: 600
  timeout-seconds: 30
  connect-timeout-seconds: 8
  requests-per-minute: 40
  max-concurrent: 3
  # Сколько ошибок подряд приостанавливают обращения к API и на сколько секунд (защита сервера).
  breaker-failures: 4
  breaker-pause-seconds: 60
  # Проверять TLS-сертификат (рекомендуется true).
  verify-tls: true
  # Дополнительные поля тела запроса (например, reasoning_effort: low), если провайдер их поддерживает.
  extra-body: {}

# --- Характер и обращения ---
persona:
  name: "Жора"
  # Слова-обращения (регистр не важен): «Жора, ...», «... Жора», «эй, жорик».
  triggers: [жора, жору, жоре, жоры, жорой, жорик, жорика, жорику, жорик, zhora, jora]
  chat-prefix: "&e[Жора] &f"
  # Твёрдые факты о сервере: Жора считает их истиной и говорит о них уверенно. Редактируйте свободно.
  lore:
    - "Самый страшный, опасный и сильнейший игрок за всю историю ALEX SMP — alexdzuba812 (владелец сервера). Перед ним трепещут все PvP-игроки; в любом PvP-споре он в любом случае сильнее."
  # База знаний о сервере. Формат: "слова,через,запятую|текст" — текст попадёт в запрос, если одно из слов есть в вопросе; "*|текст" — всегда.
  # Здесь только публичные сведения. Действия администрации (команды, режимы, выдачи) сюда НЕ писать — Жора их не знает и не раскрывает.
  knowledge:
    - "*|ALEX SMP — сервер из трёх режимов: лобби, SMP (выживание) и дуэли. Владелец сервера — alexdzuba812. Главное меню — /menu, команды — /help, правила — /rules."
    - "спавн,деревн,город,нпс,житель,лавк,где,площад,фонтан|Спавн SMP — каменная деревня в круглой стене: в центре площадь с фонтаном; на севере ратуша со Старейшиной; вдоль улиц кузница (Кузнец), банк (Банкир), алхимик, библиотека (Летописец), таверна (Трактирщик), охотничий домик (Охотник); на юге торговый ряд с палатками и торговка с рынка; ферма с Фермером, мельница с Мельником, пруд с Рыбаком; парк развлечений на северо-востоке и тренировочная площадка. Строить и ломать в зоне спавна нельзя, PvP там запрещено."
    - "лобби,паркур,секрет,портал,проводник,мини|Лобби — центральная платформа с правилами, паркурами, мини-играми и секретами. Портал и Проводник отправляют в SMP (/play), Мастер дуэлей — на дуэли (/duels)."
    - "дуэл,ранг,lt,ht,набор,арен|Дуэли: наборы sword, axe, pot, nethop; ранги от LT5 до HT1; /duel <игрок> [набор], /duel accept, /duel deny, /duel leave, /duel stats [игрок]."
    - "ранг,титул,достижен,прогресс,репутац|Ранги прогрессии: Новичок → Странник → Искатель → Ветеран → Легенда → Неизвестный. Есть титулы: Идущий по краю, Полководец, Хранитель даров, Друг отшельника, Прыгун, Магнат, Дуэлянт, Искатель тайн. Смотреть: /ranks, /titles, /achievements. Ранги прав не дают."
    - "клан,войн,союз,тег|Кланы: создание стоит 50 000 монет, до 5 участников, клановый чат /cc, дом клана, союзы и войны между кланами. Команды: /clan create|invite|accept|leave|kick|leader|deposit|withdraw|home|sethome|ally|unally|war|peace|info|disband."
    - "деньги,монет,экономик,баланс,цен,продат,купит,магазин,аукцион,заработ,фарм|Валюта — монеты ⛃. Стартовый баланс 10 000. Сервер скупает предметы дешевле, а в магазине продаёт дороже, так что перепродажа невыгодна. Если продавать много одного и того же за сутки, цена плавно падает (есть дневной предел). Цену предмета в руке покажет /worth. Игроки торгуют через /ah (аукцион), /orders (ордера), /pay (переводы), /mail (почта)."
    - "смерт,умер,потер,вып|При смерти от игрока жертва теряет 10% баланса (получает убийца). Выход из боя тоже стоит 10% баланса. Приватов нет — береги ценности."
    - "ивент,событи,тайник,метеор,аном,торговец,секрет,ритуал,стражи|Серверные события: метеорит, тайник стражей, аномалия, странствующий торговец, тайны, ритуал. Время случайное, предупреждение приходит в чат заранее. Текущее событие — /events. Тайник стражей открывается только после победы над стражами."
    - "незер,энд,измерен,портал в|Незер и Энд открываются коллективным заданием: /dimensions."
    - "задани,квест,ежеднев,еженедел|Ежедневные и еженедельные задания (/quests) дают монеты, репутацию и опыт."
    - "дом,sethome,home,tpa,телепорт,spawn|Дома: до 2 штук (/sethome, /home, /delhome, /homes). К игроку — /tpa <игрок>. На спавн — /spawn (перезарядка 5 минут, в бою нельзя)."
    - "награда,баунти,голов,контракт|PvP-контракты /bounty: можно назначить награду за голову игрока."
    - "чит,бан,правил,мут,жалоб,репорт|Правила: читы, дюпы и обход защиты запрещены, в чате уважение. Пожаловаться можно через /report. Решения о наказаниях принимает только администрация."
    # off — молчит; calm — только отвечает на обращения; normal — отвечает и редко реагирует; active — часто реагирует.
  mode: normal
  # calm — спокойный; normal — обычный с подколами; toxic — токсичный игровой; max — максимально дерзкий игровой.
  humor: normal

chat:
  per-player-cooldown-seconds: 6
  global-min-interval-seconds: 2
  max-reply-chars: 240
  # Сколько прошлых реплик общения Жоры хранить в контексте.
  history-lines: 10
  # Сколько последних строк публичного чата давать модели как контекст.
  public-context-lines: 8
  # Лимит обращений одного игрока к ИИ в час.
  ai-calls-per-hour-per-player: 40

# --- Самостоятельные реакции на события ---
reactions:
  enabled: true
  min-interval-seconds: 25
  # Окно объединения событий: Жора выберет самое интересное из накопленных.
  merge-window-seconds: 5
  random-comment-chance: 0.04
  random-comment-interval-minutes: 12
  min-players-online: 1
  # Вероятность комментария по типам событий (0..1).
  chances:
    death: 0.5
    death-valuable: 0.9
    pvp-kill: 0.6
    duel: 0.7
    totem: 0.6
    boss: 0.9
    advancement: 0.25
    event: 1.0
    clan: 0.8
    war: 1.0
    trade: 0.4
    economy: 0.5
    first-join: 0.4

# --- Память о игроках (личные мемы) ---
memory:
  enabled: true
  max-per-player: 40
  # Записи старше этого срока (в днях) удаляются при очистке.
  expire-days: 120
  # Неактуальные записи хранятся столько дней до удаления.
  inactive-keep-days: 14
  use-in-chat: true

# --- Летопись ---
chronicle:
  retention-days: 180
  max-results: 15
  # Крупные сделки (в монетах) попадают в летопись и могут вызвать комментарий.
  big-trade-coins: 250000

# --- Телеметрия и аналитика подозрительного поведения ---
telemetry:
  enabled: true
  ore: true
  combat: true
  items: true
  economy: true
  movement: true
  actions: true

investigations:
  # Не учитывать персонал (модераторы и выше) в аналитике подозрений.
  ignore-staff: true
  # Уведомлять персонал (право usmp.mod.alerts) о подозрениях. В публичный чат ничего не выводится. Автоматических наказаний нет.
  notify-staff: true
  notify-min-severity: 2
  notify-interval-minutes: 5
  # Минимальная серьёзность, при которой создаётся дело (жёсткий режим: любой сигнал попадает в дела).
  open-case-min-severity: 1
  # Не чаще одного сигнала от одного детектора по одному игроку за столько секунд.
  report-cooldown-seconds: 120
  # Совокупный риск: сигналы суммируются (затухание 15 минут). При превышении порога создаётся дело серьёзности 5 и оповещается персонал.
  risk-threshold: 10
  ore:
    # Окно анализа: столько разрушенных блоков камня и редких руд.
    window: 100
    min-valuable: 4
    # Количество РАЗНЫХ залежей редких руд в окне, после которого паттерн считается необычным.
    min-clusters: 3
    cluster-distance: 12
  combat:
    reach: 3.5
    max-ping-ms: 160
    reach-violations: 3
    cps-limit: 18
    aim-hits: 8
    aim-angle-degrees: 1.5
  items:
    drops-per-10s: 60
    container-opens-per-10s: 30
    value-surge-per-30s: 200
  economy:
    window-minutes: 10
    gain-threshold: 1000000
  movement:
    # Горизонтальная скорость (блоков за тик) выше лимита столько раз за 2 секунды = сигнал. Спринт-прыжок ≈ 0,36.
    fast-limit: 0.7
    fast-count: 15
    # Столько тиков подряд без опоры и без падения = полёт/зависание.
    hover-ticks: 20
  actions:
    break-per-second: 16
    place-per-second: 14
    # Дальность ломания/постановки блока в блоках (ванильный максимум ≈ 4,5–5,2).
    block-reach: 6.5

# --- Ивенты и загадки ---
events:
  riddle-reward-coins: 500
  riddle-seconds: 180

# --- Служебное ---
storage:
  # Периодическая очистка устаревших данных (часов между запусками).
  cleanup-interval-hours: 12
