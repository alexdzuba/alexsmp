# ============================================================
#  Журналы и резервное копирование
# ============================================================
retention:
  # Срок хранения журналов действий (экономика, рынок, администрирование и банки кланов хранятся бессрочно).
  actions-days: 60
  # Срок хранения журнала блоков (для откатов). 0 — бессрочно.
  blocks-days: 30

backup:
  # Каждые N часов — автоматическая копия.
  interval-hours: 6
  # Папка копий. Рекомендуется АБСОЛЮТНЫЙ путь на другом диске/в другом хранилище
  # (копии рядом с рабочей базой не защищают от отказа диска). Относительный путь — внутри папки плагина.
  directory: "backups"
  # Сколько последних копий хранить.
  keep: 12
  # Включать миры в копию (может занимать много места).
  include-worlds: true
  # Какие миры копировать (пусто — все загруженные).
  worlds: []
  # Проверять целостность сразу после создания (контрольные суммы, integrity_check, пробное чтение).
  verify-after-create: true
