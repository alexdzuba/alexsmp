  exploration:
    - {item: "potion:explorer", weight: 10}
    - {item: "potion:night_vision_plus", weight: 10}
    - {item: "unique:wanderer_boots", weight: 3}
    - {item: "unique:seers_helm", weight: 2}
    - {item: "unique:miner_pick", weight: 2}
    - {item: "EMERALD:5", weight: 15}
  exploration_far:
    - {item: "potion:guardian", weight: 8}
    - {item: "potion:strength_plus", weight: 6}
    - {item: "unique:seers_helm", weight: 4}
    - {item: "unique:ember_blade", weight: 3}
    - {item: "unique:phantom_bow", weight: 2}
    - {item: "TOTEM_OF_UNDYING:1", weight: 2}
    - {item: "DIAMOND:4", weight: 10}

exploration:
  # Шанс особой находки в сундуках структур (генерируются один раз — находки не возрождаются).
  base-chance: 0.06
  chance-per-1000-blocks: 0.02
  max-chance: 0.25
  far-distance: 6000

# ------------------------------------------------------------
#  Особые чары: книги в /shop → «Особые чары» и /usmp ench give. Накладываются кликом книгой по предмету.
#  Цена книги = цена × уровень².
# ------------------------------------------------------------
custom-enchants:
  enabled: true
  shop: true
  # Сколько особых чар может быть на одном предмете.
  max-enchants-per-item: 5
  # Шанс выловить книгу особых чар с «Опытным рыбаком» (0.005 = 0,5% за улов).
  bookfisher-chance: 0.005
  timber-max-logs: 80
  prices:
    autosmelt: 60000
    telekinesis: 40000
    drill: 150000
    timber: 80000
    vampire: 30000
    thunder: 50000
    nightvision: 25000
    springs: 20000
    haste: 40000
    wisdom: 25000
    lucky: 50000
    execute: 40000
    poison: 30000
    behead: 45000
    bleed: 35000
    frost: 30000
    secondwind: 120000
    steelskin: 50000
    pyro: 250000
    stealth: 150000
    fisher: 25000
    bookfisher: 100000
    unbreakable: 400000
