# ============================================================
#  Режим «Дуэли» — наборы как на MCTiers
#  Вещи SMP при входе сохраняются в БД и полностью возвращаются при выходе.
# ============================================================
config-version: 2

world: "usmp_duels"
arenas: 4
countdown-seconds: 5
match-seconds: 420
# Естественная регенерация здоровья в дуэлях (false = лечиться только предметами). Голод в дуэлях всегда отключён.
natural-regeneration: false
time: 13000

# Тиры (как на MCTiers): рейтинг набора → тир. Порядок: LT5, HT5, LT4, HT4, LT3, HT3, LT2, HT2, LT1, HT1.
# Каждый игрок начинает с 1000 (LT5). Рядом с ником показывается лучший тир по всем наборам.
tiers: [0, 1030, 1080, 1140, 1210, 1290, 1380, 1480, 1590, 1710]

# Предметы: MATERIAL[@тип_зелья][:кол-во][#чары=уровень,...][*повторов]
# build: true — на арене можно ставить блоки, лить воду/лаву, ставить кристаллы (после боя арена восстанавливается).
kits:
  sword:
    name: "&fSword"
    icon: DIAMOND_SWORD
    description: "Чистый мечевой бой: тайминги и стрейфы"
    helmet: "DIAMOND_HELMET#protection=3,unbreaking=3"
    chestplate: "DIAMOND_CHESTPLATE#protection=3,unbreaking=3"
    leggings: "DIAMOND_LEGGINGS#protection=3,unbreaking=3"
    boots: "DIAMOND_BOOTS#protection=3,unbreaking=3"
    items: ["DIAMOND_SWORD#sharpness=4", "COOKED_BEEF:16"]
  axe:
    name: "&6Axe"
    icon: DIAMOND_AXE
    description: "Топор против щита: ломай блок и дожимай"
    helmet: "DIAMOND_HELMET#protection=3"
    chestplate: "DIAMOND_CHESTPLATE#protection=3"
    leggings: "DIAMOND_LEGGINGS#protection=3"
    boots: "DIAMOND_BOOTS#protection=3"
    offhand: "SHIELD"
    items: ["DIAMOND_AXE#sharpness=4", "DIAMOND_SWORD#sharpness=4", "CROSSBOW#quick_charge=1", "ARROW:16", "BOW#power=1", "COOKED_BEEF:16"]
  pot:
    name: "&dPot"
    icon: SPLASH_POTION
