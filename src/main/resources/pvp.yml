# ============================================================
#  PvP, боевой таймер, контракты, мобы
# ============================================================

# Боевой таймер: секунд после последнего враждебного действия.
combat-tag-seconds: 15

# Команды, запрещённые во время боя (без «/»).
blocked-commands: [spawn, home, homes, tpa, tpaccept, tpyes, lobby, hub, play, survival, smp, duels, duel, warp, back, logout, sethome]

combat-logout:
  # Не наказывать, если игрока отключил сервер/администратор (кик).
  exempt-kicked: true
  # Не наказывать при обрыве соединения по таймауту. false — таймаут считается выходом из боя.
  exempt-timeout: false

bounty:
  min: 1000
  # Неисполненный контракт возвращается заказчику через N дней.
  expire-days: 7

mobs:
  # С этого расстояния от спавна мобы замечают игроков с большей дистанции.
  far-distance: 3000
  far-follow-multiplier: 1.3
  enhanced:
    # Вероятность ночного «усиленного» моба: base + per-1000 × (расстояние/1000), не более max.
    base-chance: 0.01
    chance-per-1000: 0.006
    max-chance: 0.08
    health-multiplier: 1.5
    damage-multiplier: 1.25
    money-min: 50
    money-extra: 150
    loot-chance: 0.15
