# ============================================================
#  Кланы и войны
# ============================================================
create-cost: 50000
max-members: 5

# Автовыбор лидера, если лидер ушёл без назначения преемника:
#   очки = часы игры за N дней × weight-hours + (взносы в банк за N дней / 1000) × weight-per-1000-deposited
#   при равенстве — участник с большим стажем в клане.
succession:
  days: 14
  weight-hours: 1.0
  weight-per-1000-deposited: 1.0

war:
  duration-hours: 168
  points-kill: 10
  points-block: 1
  # Повторные убийства одного и того же игрока: не более N засчитанных за час.
  max-kills-same-victim-per-hour: 3
  # Блок засчитывается, если его поставил участник вражеского клана не менее N минут назад, и только один раз за войну.
  block-min-age-minutes: 10
  max-block-points-per-hour: 60
  # Дополнительное время при ничьей — до первого очка, но не дольше N часов (затем ничья).
  overtime-max-hours: 24
  winner-reputation: 50

# ------------------------------------------------------------
#  Территории кланов (/clan claim). Выделение — клановым жезлом (золотая мотыга с меткой, НЕ топор WorldEdit)
#  или командами /clan claim pos1 и pos2. Территория — прямоугольник на всю высоту мира.
# ------------------------------------------------------------
claims:
  # Цена за каждый блок площади (ширина × длина). Оплата из банка клана.
  price-per-block: 100
  min-side: 5
  max-side: 200
  # Наибольшая площадь одной покупки и всех территорий клана вместе.
  max-area: 40000
  max-total-area: 80000
  max-claims: 5
  # Возврат в банк при отказе от территории (в процентах от цены).
  refund-percent: 50
  # Миры, где можно приватить. Пусто — только основной мир выживания.
  worlds: []
  allies-can-build: false
  # Точку клана (/clan sethome) можно ставить только на своей территории, если она есть.
  home-inside-claim: true
  protect-from-explosions: true
  war:
    # Во время войны враги могут ломать и строить на территории (иначе война за блоки невозможна).
    enemies-can-build: true
    enemies-can-open-containers: false

# ------------------------------------------------------------
#  Точки заработка кланов. Ставит администратор: /usmp clanpoint add <название> [радиус].
#  Клан захватывает точку, простояв в радиусе без соперников capture-seconds секунд.
# ------------------------------------------------------------
points:
  enabled: true
  capture-seconds: 60
  radius: 8
  # Сколько денег точка приносит в банк клана-владельца и как часто.
  income: 5000
  income-minutes: 10
  # Платить, только если в сети есть хотя бы один участник клана.
  require-online-member: true
