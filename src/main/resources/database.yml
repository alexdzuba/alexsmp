# ============================================================
#  База данных — единственный источник истины.
#  Изменения этого файла применяются ТОЛЬКО после перезапуска сервера.
# ============================================================

# sqlite — файл в папке плагина (рекомендуется для одного сервера).
# postgresql — внешний сервер PostgreSQL.
type: sqlite

connection-timeout-ms: 10000

sqlite:
  file: "data.db"

postgresql:
  host: "localhost"
  port: 5432
  database: "unknownsmp"
  user: "unknownsmp"
  password: ""
  ssl: false
  pool-size: 8

# Перенос данных SQLite → PostgreSQL (или обратно):
#  1) /usmp backup now  (создаст копию с database.db или database.dump.gz)
#  2) измените type и параметры подключения, перезапустите сервер (создастся пустая схема)
#  3) /usmp backup restore <имя_копии> db  и перезапустите сервер ещё раз —
#     данные будут импортированы в новую БД, текущие сохранятся в backups/pre-restore-*.
