# ============================================================
#  Прогрессия: уровни, репутация, ранги, титулы, достижения
#  Ранги прогрессии дают только косметику и никогда не дают служебных прав.
#  Редактирование рангов — в игре: панель владельца → Ранги.
# ============================================================
levels:
  max: 100
  # Опыт для уровня L: xp-base × L ^ xp-exponent (суммарно).
  xp-base: 60
  xp-exponent: 1.6
  xp-per-minute: 2
  xp-per-achievement: 100
  # Боевой бонус к урону за уровень (очень малый): 0.0002 = +0.02% за уровень, не более combat-bonus-max.
  combat-bonus-per-level: 0.0002
  combat-bonus-max: 0.02

reputation:
  pvp-kill: 2
  pvp-death: -1

# Ранги — по порядку. requires: level, reputation, playtime-hours, achievements, kills, events, quests, wealth, secrets, duel-wins.
ranks:
  newbie:
    name: "&7Новичок"
  wanderer:
    name: "&aСтранник"
    requires: {level: 5, playtime-hours: 3}
    rewards: {money: 2000, cosmetic: notes, title: wanderer}
  seeker:
    name: "&bИскатель"
    requires: {level: 15, reputation: 150, playtime-hours: 15}
    rewards: {money: 10000, cosmetic: enchant, title: seeker}
  veteran:
    name: "&6Ветеран"
    requires: {level: 30, reputation: 500, achievements: 10, playtime-hours: 50}
    rewards: {money: 30000, cosmetic: flame, title: veteran}
  legend:
    name: "&5Легенда"
    requires: {level: 50, reputation: 1500, achievements: 20, events: 15}
    rewards: {money: 75000, cosmetic: soul, title: legend}
  unknown:
    name: "&4Неизвестный"
    requires: {level: 80, reputation: 4000, achievements: 30, events: 40, playtime-hours: 300}
    rewards: {money: 200000, cosmetic: end, title: unknown}

titles:
  wanderer: "&aСтранник"
  seeker: "&bИскатель"
  veteran: "&6Ветеран"
  legend: "&5Легенда"
  unknown: "&4Неизвестный"
  edge_walker: "&3Идущий по краю"
  warlord: "&cПолководец"
  keeper: "&eХранитель даров"
  hermit_friend: "&8Друг отшельника"
  parkour_master: "&eПрыгун"
  rich: "&6Магнат"
  duelist: "&cДуэлянт"
  secret_hunter: "&dИскатель тайн"
  nether_pioneer: "&4Первопроходец Незера"
  merchant: "&aКупец"

# Достижения: срабатывают, когда статистика stat достигает value.
