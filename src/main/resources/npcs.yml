# ============================================================
#  NPC (без сторонних плагинов). Облик: VILLAGER (profession), TRADER (странствующий торговец),
#  MANNEQUIN (облик игрока, skin — ник с нужным скином).
#  role: QUEST, TRADER, STORY, SECRET, EVENT, SERVICE.
#  location: "мир;x;y;z;yaw;pitch" или относительно спавна SMP: "@spawn;dx;dy;dz;yaw".
#  action: survival, duels, lobby, shop, sell, ah, orders, mail, quests, clans, ranks, top, events,
#          dimensions, menu, cosmetics, report, trades, dialogue:<id>
#  Управление в игре: /usmp npc ... и панель владельца → NPC.
# ============================================================
#  Место NPC можно задать так: "@anchor:<имя>" — точка постройки (лобби/город), создаётся автоматически при строительстве.
