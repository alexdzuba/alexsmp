# ============================================================
#  Экономика
# ============================================================
start-balance: 10000

death:
  # Потеря баланса при смерти от игрока (округление вниз). Деньги получает убийца.
  loss-percent: 10

combat-logout:
  # Потеря баланса при выходе во время боя. Получает игрок, нанёсший больше всего урона в текущем бою.
  # При равенстве урона — тот, кто ударил последним. Если источника урона нет — деньги сгорают.
  loss-percent: 10

pay:
  min: 1
  max: 1000000000
  # Подтверждение через GUI для крупных переводов.
  confirm-above: 100000

# ------------------------------------------------------------
#  Камни заработка (/secretmoney). income — сколько приносит камень за один период pay-every-seconds.
#  При 60 секундах окупаемость = price / income минут.
# ------------------------------------------------------------
money-stones:
  enabled: true
  max-per-player: 10
  pay-every-seconds: 60
  # Доход идёт только когда владелец на сервере.
  require-online: true
  tiers:
    coal: {name: "&8Угольный камень заработка", block: COAL_BLOCK, price: 30000, income: 500}
    iron: {name: "&fЖелезный камень заработка", block: IRON_BLOCK, price: 60000, income: 1000}
    gold: {name: "&6Золотой камень заработка", block: GOLD_BLOCK, price: 120000, income: 2000}
    diamond: {name: "&bАлмазный камень заработка", block: DIAMOND_BLOCK, price: 240000, income: 4000}
    emerald: {name: "&aИзумрудный камень заработка", block: EMERALD_BLOCK, price: 360000, income: 6000}
    netherite: {name: "&5Незеритовый камень заработка", block: NETHERITE_BLOCK, price: 500000, income: 8350}

# ------------------------------------------------------------
#  Загрузчики чанков (покупаются в /shop). Держат область вокруг себя загруженной, даже без игроков рядом.
#  Работают воронки, печи и редстоун. Спавнеры в зоне загрузчика работают и без игроков рядом (activate-spawners).
# ------------------------------------------------------------
chunk-loaders:
  enabled: true
  price: 1000000
  max-per-player: 2
  # Радиус в чанках: 1 = область 3×3 чанка, 0 = только свой чанк, 2 = 5×5.
  radius-chunks: 1
  # Спавнеры в зоне загрузчика спавнят мобов, даже когда рядом никого нет.
  activate-spawners: true
  # Такие мобы не исчезают сами, поэтому больше этого числа мобов одного вида в радиусе 24 блоков от спавнера не спавнится.
  spawner-area-cap: 40

# ------------------------------------------------------------
#  Обмен между игроками (/trade <игрок>, второй: /trade accept).
# ------------------------------------------------------------
trade:
  # Максимальное расстояние между игроками (0 — без ограничения, но в одном мире).
  max-distance: 32

# ------------------------------------------------------------
#  Спавнеры (/shop → «Спавнеры»). Пустой спавнер + яйца мобов; яйцо ставится в спавнер правым кликом.
#  Купленный спавнер снимается киркой с Шёлковым касанием (моб сохраняется).
# ------------------------------------------------------------
spawners:
  enabled: true
  # Цена пустого спавнера.
  price: 10000
  # true — моб из спавнера появляется при любом свете и без воды/лавы под ним (стражи, лавомерки и т.п.).
  # false — обычные правила Minecraft (монстрам нужна темнота, стражам вода, лавомеркам лава).
  any-conditions: true
  silk-touch-pickup: true
  # Яйца и их цены. 0 — яйцо не продаётся.
  eggs:
    WITHER_SKELETON: 1000000
    PIGLIN_BRUTE: 1200000
    EVOKER: 1400000
    STRIDER: 1600000
    BLAZE: 1800000
    VINDICATOR: 2000000
    HOGLIN: 2200000
    GUARDIAN: 2400000
    ELDER_GUARDIAN: 2600000
    GHAST: 2800000
    ZOGLIN: 3000000
    RAVAGER: 3200000
    ENDERMITE: 3400000
    PIGLIN: 3600000
    CREEPER: 3800000
    ENDERMAN: 4000000
    SLIME: 4200000
    MAGMA_CUBE: 4500000
    HUSK: 4800000
    ZOMBIE_VILLAGER: 5000000

# ------------------------------------------------------------
#  Кейсы (/cases) и лотерея (/lottery). Средняя выдача кейса меньше его цены — это «пылесос» лишних денег.
#  Награда: "<вес> <что>". Что: money:<сумма>, MATERIAL:кол-во, ce:<особые чары>:<уровень>, potion:<id>, unique:<id>.
#  Шанс = вес / сумма весов. Награды с шансом 2% и меньше объявляются всем.
# ------------------------------------------------------------
cases:
  enabled: true
  list:
    common:
      name: "&aОбычный кейс"
      icon: CHEST
      price: 50000
      rewards:
        - "30 money:20000"
        - "20 money:40000"
        - "15 DIAMOND:4"
        - "12 EXPERIENCE_BOTTLE:32"
        - "10 GOLDEN_APPLE:4"
        - "8 money:80000"
        - "4 ce:vampire:1"
        - "1 money:250000"
    rare:
      name: "&bРедкий кейс"
      icon: ENDER_CHEST
      price: 250000
      rewards:
        - "30 money:100000"
        - "20 money:180000"
        - "15 DIAMOND_BLOCK:2"
        - "12 NETHERITE_INGOT:1"
        - "10 ENCHANTED_GOLDEN_APPLE:1"
        - "7 ce:drill:1"
        - "5 money:500000"
        - "1 money:1500000"
    legendary:
      name: "&6Легендарный кейс"
      icon: SHULKER_BOX
      price: 1000000
      rewards:
        - "30 money:400000"
        - "20 money:700000"
        - "15 NETHERITE_INGOT:4"
        - "12 ce:unbreakable:1"
        - "10 TOTEM_OF_UNDYING:2"
        - "6 ELYTRA:1"
        - "5 money:2000000"
        - "2 WITHER_SKELETON_SPAWN_EGG:1"
        - "1 money:5000000"

lottery:
  enabled: true
  ticket-price: 10000
  # Максимум билетов у одного игрока на розыгрыш.
  max-tickets: 1000
  # Час розыгрыша (по времени сервера, zone в config.yml). Раз в день.
  draw-hour: 20
  # Минимум участников, иначе билеты переходят на следующий день.
  min-players: 2
  # Налог с банка (сгорает).
  tax-percent: 10
